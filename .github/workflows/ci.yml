name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # postinstall runs `prisma generate` (no DB needed).
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build never connects (all tenant pages are force-dynamic); a dummy
          # URL just satisfies Prisma client construction. RLS stays off in CI.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
          DB_RLS: "off"
